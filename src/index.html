<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spots social media page project" />
    <meta name="author" content="Sean Semyck" />
    <meta name="keywords" content="Spots, Project, Social Media" />

    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="<%=require('./images/logo.svg')%>"
          alt="Spot logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn">
              <img
                src="<%=require('./images/wht-pencil-icon.svg')%>"
                alt="Edit Icon"
                class="profile__pencil-icon"
              />
            </button>
            <img
              src="<%=require('./images/avatar.jpg')%>"
              alt="Bessie Coleman"
              class="profile__avatar"
            />
          </div>
          <div class="profile__column">
            <h1 class="profile__title">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-btn">
              <img
                src="<%=require('./images/edit-btn-icon.svg')%>"
                alt="pencil icon"
                class="profile__edit-btn-icon"
              />Edit Profile
            </button>
          </div>
          <button type="button" class="profile__add-btn">
            <img
              src="<%=require('./images/addition-icon.svg')%>"
              alt="Addition icon"
            />
            New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <img class="card__image" src="#" alt="" />
                <button
                  type="button"
                  aria-label="delete button"
                  class="card__delete-btn"
                ></button>
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button
                    type="button"
                    aria-label="like button"
                    class="card__like-btn"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__content">2025 &copy; Spots</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button
            type="button"
            aria-label="Close modal"
            class="modal__close-btn"
          >
            <img src="<%=require('./images/close-btn.svg')%>" alt="Closing X" />
          </button>
          <h2 class="modal__title">Edit profile</h2>
          <form class="modal__form">
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type your name"
                required
                minlength="2"
                maxlength="40"
              />
              <span id="profile-name-input-error" class="modal__error"></span>
            </label>
            <label for="profile-description-input" class="modal__label">
              Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
                required
                minlength="2"
                maxlength="200"
              />
              <span
                id="profile-description-input-error"
                class="modal__error"
              ></span>
            </label>
            <button type="submit" class="modal__btn">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button
            type="button"
            aria-label="Close modal"
            class="modal__close-btn"
          >
            <img src="<%=require('./images/close-btn.svg')%>" alt="Closing X" />
          </button>
          <h2 class="modal__title">New post</h2>
          <form class="modal__form">
            <label for="image-link-input" class="modal__label">
              Image link
              <input
                id="image-link-input"
                type="url"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required
              />
              <span id="image-link-input-error" class="modal__error"></span>
            </label>
            <label for="image-caption-input" class="modal__label">
              Caption
              <input
                id="image-caption-input"
                type="text"
                class="modal__input"
                placeholder="Type your caption"
                required
                minlength="2"
                maxlength="30"
              />
              <span id="image-caption-input-error" class="modal__error"></span>
            </label>
            <button type="submit" class="modal__btn">Save</button>
          </form>
        </div>
      </div>
      <div class="modal modal_type_preview" id="preview-modal">
        <div class="modal__image-container">
          <button
            type="button"
            aria-label="Close modal"
            class="modal__close-btn modal__close-btn_type_preview"
          >
            <img
              src="<%=require('./images/close-btn-white.svg')%>"
              alt="Close button"
            />
          </button>
          <img src="#" alt="" class="modal__image" />
          <p class="modal__caption"></p>
        </div>
      </div>

      <div class="modal" id="avatar-modal">
        <div class="modal__container">
          <button
            type="button"
            aria-label="Close modal"
            class="modal__close-btn"
          >
            <img src="<%=require('./images/close-btn.svg')%>" alt="Closing X" />
          </button>
          <h3 class="modal__title">Edit Avatar</h3>
          <form class="modal__form" id="edit-avatar-form">
            <label for="profile-avatar-input" class="modal__label">
              Avatar
              <input
                id="profile-avatar-input"
                type="url"
                class="modal__input"
                placeholder="Avatar goes here"
                required
              />
              <span id="profile-avatar-input-error" class="modal__error"></span>
            </label>
            <button type="submit" class="modal__btn">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="delete-modal">
        <div class="modal__container">
          <button
            type="button"
            aria-label="Close modal"
            class="modal__close-btn"
          >
            <img src="<%=require('./images/close-btn.svg')%>" alt="Closing X" />
          </button>
          <h3 class="modal__title">
            Are you sure you want to delete this image?
          </h3>
          <form class="modal__form" id="deletion-form">
            <button type="submit" class="modal__btn">Delete</button>
            <button type="button" class="modal__btn">Cancel</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
